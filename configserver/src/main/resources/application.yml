spring:
  application:
    name: configserver
  cloud:
    config:
      server:
        git:
          uri: https://github.com/swarna678/microservices-eazybytes-config.git
          default-label: main
          timeout: 5
          clone-on-start: true
          force-pull: true

  rabbitmq:
    host: "localhost"
    port: 5672
    username: "guest"
    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
   readiness-state:
    enabled: true
   liveness-state:
     enabled: true
  endpoint:
    health:
      probes:
        enabled: true

